<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>4K POS — Manual del Operador / Operator Manual</title>
<style>
  @page { size: Letter; margin: 20mm 18mm 22mm; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #1a2233;
    font-size: 10.5pt;
    line-height: 1.5;
    margin: 0;
  }
  h1, h2, h3, h4 { font-family: 'Segoe UI', Arial, sans-serif; color: #0d1b3e; margin: 0 0 6px; }
  a { color: #1e40af; text-decoration: none; }

  /* ── Cover ── */
  .cover {
    height: 240mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(160deg, #0a0f1f 0%, #10224f 55%, #1e3a8a 100%);
    color: #fff;
    page-break-after: always;
    border-radius: 0;
  }
  .cover .logo { font-size: 46pt; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; }
  .cover .logo .c1 { color: #3b82f6; } .cover .logo .c2 { color: #22c55e; }
  .cover .logo .c3 { color: #e6b800; } .cover .logo .c4 { color: #ef4444; }
  .cover .sub { font-size: 13pt; color: #93c5fd; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 60px; }
  .cover .title { font-size: 26pt; font-weight: 800; margin-bottom: 8px; }
  .cover .title2 { font-size: 26pt; font-weight: 800; color: #93c5fd; margin-bottom: 40px; }
  .cover .ver { font-size: 10pt; color: rgba(255,255,255,.5); margin-top: 80px; }

  /* ── Bilingual index page ── */
  .idx-page { page-break-after: always; }
  .idx-cols { display: flex; gap: 24px; }
  .idx-col { flex: 1; }
  .idx-col h2 { font-size: 15pt; border-bottom: 2px solid #1e3a8a; padding-bottom: 6px; margin-bottom: 10px; }
  .idx-group { font-size: 8.5pt; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: #6b7280; margin: 12px 0 3px; }
  .idx-item { font-size: 9.3pt; padding: 2px 0; display: flex; }
  .idx-item .n { color: #1e40af; font-weight: 700; width: 18px; flex-shrink: 0; }
  .idx-item a { color: #1a2233; }
  .idx-admin-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #dc2626; margin-left: 5px; vertical-align: middle; }

  /* ── Language part divider ── */
  .lang-divider {
    height: 240mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: #0d1b3e;
    color: #fff;
    page-break-after: always;
  }
  .lang-divider .flag {
    font-size: 12pt; font-weight: 800; letter-spacing: 4px;
    color: #0d1b3e; background: #93c5fd; display: inline-block;
    padding: 6px 22px; border-radius: 20px; margin-bottom: 22px;
  }
  .lang-divider h1 { color: #fff; font-size: 30pt; }
  .lang-divider p { color: #93c5fd; font-size: 12pt; margin-top: 8px; }

  /* ── Sections ── */
  .group-header {
    background: #0d1b3e;
    color: #fff;
    padding: 10px 16px;
    font-size: 13pt;
    font-weight: 800;
    border-radius: 6px;
    margin: 0 0 14px;
    page-break-before: always;
  }
  .group-header.first { page-break-before: auto; }

  section.topic {
    page-break-inside: avoid;
    margin-bottom: 22px;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 16px;
  }
  section.topic h3 {
    font-size: 13.5pt;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  section.topic h3 .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 5px;
    background: #1e3a8a; color: #fff; font-size: 10pt; font-weight: 800; flex-shrink: 0;
  }
  .admin-badge {
    display: inline-block;
    background: #dc2626;
    color: #fff;
    font-size: 7.5pt;
    font-weight: 800;
    letter-spacing: .5px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 4px;
    vertical-align: middle;
  }
  .purpose { color: #475569; font-size: 9.8pt; margin: 4px 0 10px; }
  .steps { margin: 0 0 8px; padding-left: 0; list-style: none; counter-reset: step; }
  .steps li {
    counter-increment: step;
    position: relative;
    padding-left: 22px;
    margin-bottom: 5px;
    font-size: 9.7pt;
  }
  .steps li::before {
    content: counter(step);
    position: absolute; left: 0; top: 0.5px;
    width: 15px; height: 15px; border-radius: 50%;
    background: #dbeafe; color: #1e3a8a; font-size: 7.5pt; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .note, .warn {
    font-size: 9pt;
    padding: 7px 10px;
    border-radius: 5px;
    margin-top: 6px;
  }
  .note { background: #eff6ff; border-left: 3px solid #3b82f6; color: #1e3a8a; }
  .warn { background: #fef2f2; border-left: 3px solid #dc2626; color: #7f1d1d; }
  .shot {
    display: block;
    max-width: 100%;
    border: 1px solid #d1d9e6;
    border-radius: 6px;
    margin-top: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .shot-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .shot-row .shot { flex: 1; min-width: 140px; margin-top: 0; }
  .shot-sm { max-width: 60%; }
  .shot-caption { font-size: 8pt; color: #64748b; margin-top: 3px; font-style: italic; }

  footer.pagefoot { font-size: 7.5pt; color: #94a3b8; text-align: center; }
</style>
</head>
<body>

<div class="cover">
  <div class="logo"><span class="c1">4</span><span class="c1">K</span> <span class="c2">P</span><span class="c3">O</span><span class="c4">S</span></div>
  <div class="sub">4K Solutions</div>
  <div class="title">Manual del Operador</div>
  <div class="title2">Operator Manual</div>
  <div class="ver">Versión del sistema cubierta en este manual: 4K POS v5 · Edición 2026</div>
</div>

</html>
